name: rebuild (no fetch + deploy)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Lichte deploy-gate: alleen ruff + pytest. Volledige suite draait op push/PR (ci.yml).

  build:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      - name: Restore data cache (VERPLICHT)
        id: datacache
        uses: actions/cache/restore@v6
        with:
          path: .data
          key: honkbal-data-${{ github.run_id }}
          restore-keys: |
            honkbal-data-

      - name: Fail luid als cache ontbreekt
        if: steps.datacache.outputs.cache-matched-key == ''
        run: |
          echo "::error::geen data-cache gevonden — rebuild zonder fetch kan niet renderen. Draai eerst build.yml."
          exit 1

      - name: Write version.txt (<sha:12>-<run>)
        run: echo "${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" > version.txt

      - name: Render site → docs/
        run: uv run honkbal render --out docs --data-dir .data

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Secrets horen in deze environment; beperk hem in de repo-instellingen tot branch `main`,
    # zodat een workflow_dispatch op een andere branch niet naar productie kan deployen.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/vercel
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: docs

      # Vercel bouwt niets zelf: CI levert kant-en-klare Build Output API v3 aan
      # (.vercel/output/static = docs/, routes/headers uit deploy/vercel/config.json).
      # Publieke repo: token en IDs alleen via secrets. De CLI schrijft deployment-URL's (met
      # team-slug) naar stdout én stderr; die gaan naar een logbestand en alleen bij een fout
      # (staart) naar het publieke log.
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID niet gezet — geen deploy"
            exit 1
          fi
          mkdir -p .vercel/output
          cp -r docs .vercel/output/static
          cp deploy/vercel/config.json .vercel/output/config.json
          if ! npx --yes vercel@62.1.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" \
               > "$RUNNER_TEMP/vercel.log" 2>&1; then
            echo "::error::Vercel-deploy mislukt"
            tail -n 20 "$RUNNER_TEMP/vercel.log"
            exit 1
          fi
          echo "Vercel-productiedeploy geslaagd"

      # bunny.net (CDN vóór Vercel op honkbal.net, origin = Vercel-productiedomein) cachet de
      # site; zonder purge blijft een verse deploy tot de TTL oud. Secrets: BUNNY_API_KEY +
      # BUNNY_PULLZONE_ID. Ontbreken ze, of faalt de purge, dan alleen een waarschuwing.
      - name: Purge bunny.net-cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          if [ -z "$BUNNY_API_KEY" ] || [ -z "$BUNNY_PULLZONE_ID" ]; then
            echo "::warning::BUNNY_API_KEY/BUNNY_PULLZONE_ID niet gezet — bunny-cache niet gepurged"
            exit 0
          fi
          if curl -sf -X POST "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
               -H "AccessKey: ${BUNNY_API_KEY}" -H "Content-Length: 0"; then
            echo "bunny-cache gepurged"
          else
            echo "::warning::bunny-purge mislukt — cache verloopt volgens TTL"
          fi
