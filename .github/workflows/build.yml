name: build (fetch + deploy)

on:
  schedule:
    # Behoud de NL-afgestelde cadans van de oude PHP-build (alleen uitvoering = Python nu).
    - cron: '0 0 * 1,2,3,11,12 *'   # offseason 01:00 CET
    - cron: '0 23 * 3-9 *'          # seizoen 01:00 CEST (vorige dag 23:00 UTC)
    - cron: '0 8 * 4-10 *'          # 10:00 CEST
    - cron: '0 13 * 4-10 *'         # 15:00 CEST
    - cron: '0 16 * 4-10 *'         # 18:00 CEST
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - name: Sync (frozen)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Python acceptatietests (incl. config-validatie-gate)
        run: uv run pytest -q
      # Lichte deploy-gate: alleen ruff + pytest. De volledige suite (node:test +
      # Playwright) draait op push/PR in ci.yml — code verandert daar, niet bij een
      # cron-deploy (zelfde commit, alleen verse data). De render-stap valideert config
      # en faalt luid, dus data-/datumrisico is hier al afgedekt.

  build:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      - name: Restore data cache (last-known-good)
        id: datacache
        uses: actions/cache@v6
        with:
          path: .data
          key: honkbal-data-${{ github.run_id }}
          restore-keys: |
            honkbal-data-

      - name: Log cache status
        run: |
          if [ "${{ steps.datacache.outputs.cache-matched-key }}" = "" ]; then
            echo "::warning::geen eerdere data-cache hersteld — verse fetch volgt"
          else
            echo "data-cache hersteld via ${{ steps.datacache.outputs.cache-matched-key }}"
          fi

      # Zelfherstel (SPEC §3.3): de ESPN watch-apiKey is een publieke paginaconstante die kan
      # roteren. Draaide de vorige fetch niet (meer) op bron "espn", kijk de key dan headless
      # opnieuw af en cache hem in .data/espn_watch_config.json. Faalt zacht: zonder verse key
      # gebruikt de fetch de ingebouwde fallback-constante en anders tvgids.nl.
      - name: Zelfherstel ESPN watch-apiKey (alleen indien nodig)
        run: |
          if [ ! -f .data/tv_guide.json ] || [ "$(jq -r '.source // empty' .data/tv_guide.json)" != "espn" ]; then
            npm ci
            npx playwright install --with-deps chromium
            npm run discover:espn || echo "::warning::apiKey-discovery mislukt; fetch gebruikt fallback-key of tvgids.nl"
          else
            echo "tv-gids draaide op ESPN — discovery overgeslagen"
          fi

      - name: Fetch data (schedule altijd; ESPN-postseason als now>=ps)
        run: uv run honkbal fetch --data-dir .data

      - name: Write version.txt (<sha:12>-<run>)
        run: echo "${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" > version.txt

      - name: Render site → docs/
        run: uv run honkbal render --out docs --data-dir .data

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .data
          key: honkbal-data-${{ github.run_id }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: docs
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Secrets horen in deze environment; beperk hem in de repo-instellingen tot branch `main`,
    # zodat een workflow_dispatch op een andere branch niet naar productie kan deployen.
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/vercel
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v5
        with:
          name: site
          path: docs

      # Vercel bouwt niets zelf: CI levert kant-en-klare Build Output API v3 aan
      # (.vercel/output/static = docs/, routes/headers uit deploy/vercel/config.json).
      # Publieke repo: token en IDs alleen via secrets; output van de CLI (deployment-URL's
      # met team-slug) gaat niet naar het publieke log.
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID niet gezet — geen deploy"
            exit 1
          fi
          mkdir -p .vercel/output
          cp -r docs .vercel/output/static
          cp deploy/vercel/config.json .vercel/output/config.json
          npx --yes vercel@62.1.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" > /dev/null
          echo "Vercel-productiedeploy geslaagd"

      # bunny.net (CDN vóór Vercel op honkbal.net, origin = Vercel-productiedomein) cachet de
      # site; zonder purge blijft een verse deploy tot de TTL oud. Secrets: BUNNY_API_KEY +
      # BUNNY_PULLZONE_ID. Ontbreken ze, of faalt de purge, dan alleen een waarschuwing.
      - name: Purge bunny.net-cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          if [ -z "$BUNNY_API_KEY" ] || [ -z "$BUNNY_PULLZONE_ID" ]; then
            echo "::warning::BUNNY_API_KEY/BUNNY_PULLZONE_ID niet gezet — bunny-cache niet gepurged"
            exit 0
          fi
          if curl -sf -X POST "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
               -H "AccessKey: ${BUNNY_API_KEY}" -H "Content-Length: 0"; then
            echo "bunny-cache gepurged"
          else
            echo "::warning::bunny-purge mislukt — cache verloopt volgens TTL"
          fi
